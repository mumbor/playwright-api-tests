name: Playwright API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'

jobs:
  # ─── Main test run ────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run smoke tests
        run: npx playwright test --grep "@smoke" --reporter=list
        env:
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}

      - name: Run functional tests
        run: npx playwright test --project=jsonplaceholder --project=github --grep-invert "@performance"
        env:
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ─── Self-healing (only on push/schedule failures, never on PRs) ─────────────
  #
  # Triggered when the test job fails. Runs a fresh test pass to collect the
  # JSON failure report, sends it to Claude for classification, applies any
  # proposed framework fix, reruns to verify, and opens a PR for human review.
  #
  # Guardrails enforced in scripts/heal.ts:
  #   • Only HEALABLE_FILES may be touched (allowlist)
  #   • Total diff capped at 20 lines
  #   • old_content must match exactly once (no ambiguous replacements)
  #   • Confidence threshold ≥ 85 % before any change is applied
  #   • Maximum one healing attempt per workflow run
  #   • PR requires human review before merge (branch protection not bypassed)
  heal:
    needs: [test]
    # Only heal on push/schedule failures — not on PRs (PR branch is temporary)
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push the fix branch
      pull-requests: write  # open the PR
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run self-healing analysis
        run: npm run heal
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Performance (scheduled only) ────────────────────────────────────────────
  performance:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run performance tests
        run: npx playwright test --project=performance
        env:
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}

      - name: Upload performance report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-report
          path: playwright-report/
          retention-days: 14
